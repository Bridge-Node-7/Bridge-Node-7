name: Governed mission loop candidate

on:
  pull_request:
    paths:
      - "examples/governed-mission-loop/**"
      - ".github/workflows/governed-mission-loop-candidate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Test policy, budget, audit, and promotion boundaries
        run: python3 -m unittest discover -s examples/governed-mission-loop/tests -v
      - name: Run synthetic case and verify trace
        shell: bash
        run: |
          set -euo pipefail
          python3 examples/governed-mission-loop/mission_loop.py examples/governed-mission-loop/examples/synthetic_public_mission.json > "$RUNNER_TEMP/mission-report.json"
          python3 examples/governed-mission-loop/mission_loop.py --verify-audit "$RUNNER_TEMP/mission-report.json"

      - name: Exercise public-safe cross-domain handoff plans
        shell: bash
        run: |
          set -euo pipefail
          python3 examples/governed-mission-loop/mission_synergy.py examples/governed-mission-loop/examples/synthetic_cyber_synergy.json > "$RUNNER_TEMP/cyber-route.json"
          python3 examples/governed-mission-loop/mission_synergy.py examples/governed-mission-loop/examples/synthetic_materials_synergy.json > "$RUNNER_TEMP/materials-route.json"
          python3 - "$RUNNER_TEMP/cyber-route.json" "$RUNNER_TEMP/materials-route.json" <<'PY'
          import json, sys
          for filename in sys.argv[1:]:
              with open(filename, encoding='utf-8') as f:
                  result = json.load(f)
              assert result['execution_state'] == 'SIMULATION'
              assert not result['release_authorized']
              assert not result['external_execution_authorized']
              assert all(x['status'] == 'HUMAN_PREPARATION_ONLY' for x in result['stages'])
          print('PASS synthetic handoff boundaries')
          PY
